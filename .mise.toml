# .mise.toml — local tooling, exact pins (repo convention)
#
# The tasks below define how gibson is built and checked; CI runs the same
# tasks. Renovate keeps every pin in this file current.

[tools]
# Keep in lockstep with the toolchain directive in go.mod and the golang build
# image in Dockerfile; Renovate bumps them together. The go directive (minimum
# language version) is bumped by hand.
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "0.24.0"

# Pre-commit for Git hooks
pre-commit = "4.7.0"

# Linters. golangci-lint must match the version in .custom-gcl.yml; Renovate
# groups the two into one PR.
golangci-lint = "2.15.0"
yamllint = "1.38.0"
actionlint = "1.7.12"
# actionlint runs shellcheck on every `run:` script when it's on PATH, and
# silently skips them when it isn't.
shellcheck = "0.11.0"
# Lints the Dockerfile, and audits the workflows for injection, excessive
# permissions and credential leaks.
hadolint = "2.15.1"
zizmor = "1.31.1"

# Release tooling
goreleaser = "2.18.3"
cosign = "3.1.4"
# Scans the published image for known vulnerabilities (see the scan task).
trivy = "0.76.1"

# Pins GitHub Actions to commit SHAs (see the update-gha task)
pinact = "5.0.2"

[tasks.build]
description = "Build the gibson binary into bin/"
run = "go build -o bin/gibson ./cmd/gibson/"

[tasks.gibson]
description = "Run gibson with go run (e.g. `mise run gibson -- serve`)"
run = "go run ./cmd/gibson/"

[tasks.serve]
description = "Serve the intro over SSH on :2222 (ssh -p 2222 localhost)"
run = "go run ./cmd/gibson/ serve --listen :2222"

# `mise run fmt` rewrites everything that has a canonical form; `mise run
# lint` checks the same things without touching a file.
[tasks.fmt]
description = "Format everything: go.mod and Go sources"
run = [{ task = "go-tidy" }, { task = "go-fmt" }]

[tasks.go-tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks.go-fmt]
description = "Format Go sources with the formatters configured for golangci-lint"
run = "golangci-lint fmt"

# golint-sl runs as a golangci-lint module plugin, so it has to be compiled into
# a custom binary (./custom-gcl). Rebuilds only when .custom-gcl.yml changes.
[tasks.lint-build]
description = "Build the custom-gcl binary with the golint-sl plugin baked in"
run = """
for attempt in 1 2 3; do
  golangci-lint custom && exit 0
  echo "golangci-lint custom failed (attempt $attempt of 3)" >&2
  sleep 10
done
exit 1
"""
sources = [".custom-gcl.yml"]
outputs = ["custom-gcl"]

# GoReleaser builds the tagged tree as it is, so an untidy go.mod has to fail
# CI rather than be fixed up at release time.
[tasks.mod-tidy]
description = "Check that go.mod and go.sum are tidy"
run = "go mod tidy -diff"

[tasks.lint]
description = "Lint Go with golangci-lint and golint-sl, plus YAML, workflows and the Dockerfile"
depends = ["lint-build", "yaml-lint", "actionlint", "zizmor", "hadolint"]
run = "./custom-gcl run ./..."

[tasks.yaml-lint]
description = "Lint every YAML file in the repository"
run = "yamllint --strict ."

[tasks.actionlint]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks.zizmor]
description = "Audit the GitHub Actions workflows for security issues"
run = "zizmor --offline --min-severity low .github/workflows"

[tasks.hadolint]
description = "Lint the Dockerfile"
run = "hadolint Dockerfile"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.snapshot]
description = "Build a local GoReleaser snapshot (binaries only) into dist/"
run = "goreleaser build --snapshot --clean"

# Images are built in GoReleaser's publish phase; --snapshot builds them
# per platform into the local Docker daemon without pushing.
[tasks.image]
description = "Build the container images locally from a GoReleaser snapshot"
run = "goreleaser release --snapshot --clean --skip=sign,homebrew"

[tasks.scan]
description = "Scan an image for HIGH and CRITICAL vulnerabilities (IMAGE, default ghcr.io/spechtlabs/gibson:latest)"
run = "trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ${IMAGE:-ghcr.io/spechtlabs/gibson:latest}"

[tasks.check]
description = "The definition of done: every gate CI runs"
depends = ["lint", "mod-tidy", "release-check"]
run = "go build ./..."

[tasks.update-gha]
description = "Pin GitHub Actions to commit SHAs (Renovate keeps them current afterwards)"
run = "pinact run"
