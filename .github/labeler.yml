# The renderer and what the components draw on: canvas, stage, themes,
# timing helpers and the preview rasterizer
renderer:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/render/**"
          - "pkg/stage/**"
          - "pkg/theme/**"
          - "pkg/anim/**"
          - "pkg/preview/**"

# The scene's parts: specimens, vessels, containment, overlays, effects
components:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/components/**"

# How gibson assembles them: the scene, the app, the config
app:
  - changed-files:
      - any-glob-to-any-file:
          - "internal/**"

# The SSH server
server:
  - changed-files:
      - any-glob-to-any-file:
          - "pkg/sshserver/**"

# CLI commands and entrypoint
cli:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/**"

# The container image and deployment examples
container:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "deploy/**"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"

# Build, release, and CI plumbing
build:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"
          - ".goreleaser.yaml"
          - ".release-please-config.json"
          - ".release-please-manifest.json"
          - ".mise.toml"
          - ".golangci.yaml"
          - ".custom-gcl.yml"
          - ".pre-commit-config.yaml"
          - ".yamllint.yaml"
          - ".editorconfig"
          - "renovate.json"
          - "go.mod"
          - "go.sum"

# Add 'enhancement' to any PR whose head branch starts with `feat` or `feature`
enhancement:
  - head-branch:
      - "^feat"
      - "^feature"

# Add 'bug' to any PR whose head branch starts with `fix` or `bug`
bug:
  - head-branch:
      - "^fix"
      - "^bug"
