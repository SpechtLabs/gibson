name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or repair (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

env:
  # mise itself, pinned; go.yaml explains why.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.11

# Never cancel a release half-way: that can leave a tag published with no
# artifacts. Pushes key on the SHA so each commit gets its own run; repairs key
# on the tag so two repairs of the same tag cannot race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  # The gate: lint, snapshot build, image smoke test and scan.
  go:
    name: Go
    uses: ./.github/workflows/go.yaml
    concurrency:
      group: ${{ github.workflow }}-gate-go-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' }}

  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    needs: go
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Renovate automerges in quick succession. A run whose commit is no longer
      # main's tip leaves release-please to the newer run, so a stale run cannot
      # rewrite the release PR behind a newer one.
      - name: Refuse to act unless this run's head is still main's tip
        id: still-current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$tip" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $tip since this run started at ${SHA}; leaving release-please to that run."
          fi

      # GitHub doesn't start workflows for what GITHUB_TOKEN does: a release
      # pull request it opens gets a CI run that waits for approval.
      # RELEASE_PLEASE_TOKEN, a fine-grained personal access token with read
      # and write access to this repository's contents, pull requests and
      # issues, makes it an ordinary pull request whose CI runs. Without the
      # secret, release-please falls back to GITHUB_TOKEN.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: steps.still-current.outputs.current == 'true'
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}

  goreleaser:
    name: GoReleaser Build & Publish
    runs-on: ubuntu-latest
    needs:
      - go
      - release-please
    if: >-
      always() &&
      needs.go.result == 'success' &&
      (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: write   # attach the archives to the release
      packages: write   # push the image to ghcr.io
      id-token: write   # keyless cosign signatures
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
          persist-credentials: false

      # No cache: a release must not restore anything a pull request could
      # have written.
      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: go goreleaser cosign
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

    outputs:
      tag: ${{ env.TAG }}

  # Verifies the signature of what was just pushed and scans it into code
  # scanning.
  scan:
    name: Scan
    needs: goreleaser
    if: always() && needs.goreleaser.result == 'success'
    uses: ./.github/workflows/scan.yaml
    permissions:
      contents: read
      security-events: write
    with:
      tag: ${{ needs.goreleaser.outputs.tag }}
