version: 2

project_name: gibson

builds:
  - id: gibson
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: gibson
    main: ./cmd/gibson
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # Only the version is injected; commit, commit time and dirty state come
      # from the VCS info the Go toolchain embeds.
      - -X=main.version={{ .Version }}

archives:
  - id: gibson
    ids:
      - gibson
    name_template: "gibson_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# One multi-platform image per release on ghcr.io, with an SBOM and build
# provenance attached. See the Dockerfile for how it's hardened.
dockers_v2:
  - id: gibson
    ids:
      - gibson
    images:
      - ghcr.io/spechtlabs/gibson
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    extra_files:
      - deploy/data/README
    # A snapshot loads per-platform images into the local daemon, which can't
    # hold attestations, so the SBOM and provenance come with releases only.
    sbom: "{{ if .IsSnapshot }}false{{ else }}true{{ end }}"
    flags:
      - "--provenance={{ if .IsSnapshot }}false{{ else }}mode=max{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A retro neon SpechtLabs intro, served over SSH"
      org.opencontainers.image.url: "https://github.com/spechtlabs/gibson"
      org.opencontainers.image.source: "https://github.com/spechtlabs/gibson"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: "Apache-2.0"
      org.opencontainers.image.vendor: "Specht Labs"
    annotations:
      org.opencontainers.image.description: "A retro neon SpechtLabs intro, served over SSH"
      org.opencontainers.image.source: "https://github.com/spechtlabs/gibson"
      org.opencontainers.image.licenses: "Apache-2.0"

# Publish to SpechtLabs/homebrew-tap using HOMEBREW_TAP_GITHUB_TOKEN, a
# repository or organization Actions secret with Contents: read and write
# access to the tap. The default GITHUB_TOKEN only has access to this repo.
homebrew_casks:
  - name: gibson
    ids:
      - gibson
    repository:
      owner: SpechtLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/SpechtLabs/gibson"
    description: "A retro neon SpechtLabs intro for your terminal, also served over SSH"
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: bot@specht-labs.de
    # gibson is not Apple-notarized. Remove quarantine from the installed
    # binary so Gatekeeper allows it to run, as with the other CLIs in the tap.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gibson"]
          end

# release-please writes the changelog and creates the GitHub release; GoReleaser
# only attaches the artifacts to it.
changelog:
  disable: true

# A keyless cosign signature over checksums.txt, as a Sigstore bundle, covers
# every archive through its checksum.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

# Keyless cosign signatures on the images dockers_v2 pushed (artifacts left
# empty selects exactly those), by digest, so a tag that moves later can't
# borrow the signature.
docker_signs:
  - cmd: cosign
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

release:
  github:
    owner: spechtlabs
    name: gibson
  mode: keep-existing
